# The morning bell — a daily pulse-check on PRODUCTION.
#
# Why it exists: the S&S key expired and served a 401 to every apparel
# visitor for a WEEK before anyone noticed — 44 visitors met an error
# nobody knew was happening, because nothing watched the live site between
# deploys. CI only runs when code changes; credentials rot on their own
# schedule. This runs every morning regardless, and a red run emails the
# repo owner the same day, not the week after.
#
# Read-only on purpose: it never submits a quote, never touches Printavo,
# never creates anything. Three GETs against public endpoints:
#   1. the homepage renders and still carries the price anchor
#   2. /api/printavo-test says the shop's Printavo credentials still work
#   3. /api/ss-catalog still serves real garments (the check that would
#      have caught the 401 in one day instead of seven)
#   4. /api/artwork-upload reports uploads as CONFIGURED — not merely that
#      the store is reachable. Those came apart between 21 and 24 Sep:
#      the store answered every probe while three separate faults stopped
#      any customer uploading, and a canary watching `reachable` stayed
#      green through all of it
#   5. /api/blob-selftest actually completes an upload, when ADMIN_SECRET
#      is available to this workflow — the only check that proves the
#      customer's path rather than the store's health
name: Production canary

on:
  schedule:
    # 10:00 UTC — 6am Eastern, so a failure is in the inbox before the
    # shop opens either way the clocks sit.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level, deliberately: the `secrets` context is NOT available in a
    # step-level `if`, but `env` is. Testing `secrets.ADMIN_SECRET` directly
    # in a step condition silently evaluates to empty and the step never
    # runs — a check that quietly never fires is worse than no check.
    env:
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
    steps:
      - name: Homepage renders with the price anchor
        run: |
          # React's SSR splits the anchor as `$<!-- -->53.80` across spans, so
          # a naive grep on the raw HTML can never match (the canary's own
          # first run proved it). Strip comments and tags first, then look for
          # the human-visible phrase: "from  $53.80".
          body=$(curl -sS --max-time 30 https://labs.gorillasalem.com/ \
            | sed -e 's/<!--[^>]*-->//g' -e 's/<[^>]*>/ /g')
          echo "$body" | grep -Eiq 'from +\$[0-9]+\.[0-9]{2}' || {
            echo "::error::Homepage answered but the price anchor is missing — the page may be rendering an error shell."
            exit 1
          }

      - name: Printavo credentials still work
        run: |
          json=$(curl -sS --max-time 30 https://labs.gorillasalem.com/api/printavo-test)
          echo "$json"
          echo "$json" | node -e '
            let raw = "";
            process.stdin.on("data", (c) => (raw += c));
            process.stdin.on("end", () => {
              const r = JSON.parse(raw);
              if (r.connected !== true) {
                console.error("::error::Printavo reports NOT connected: " + (r.error ?? "no error text"));
                process.exit(1);
              }
              console.log("Printavo connected, build " + r.build);
            });
          '

      - name: The S&S catalog still serves garments
        run: |
          json=$(curl -sS --max-time 60 https://labs.gorillasalem.com/api/ss-catalog)
          echo "$json" | node -e '
            let raw = "";
            process.stdin.on("data", (c) => (raw += c));
            process.stdin.on("end", () => {
              const r = JSON.parse(raw);
              const products = Array.isArray(r.products) ? r.products : [];
              const colors = products.reduce((n, p) => n + (p.colors?.length ?? 0), 0);
              if (products.length === 0) {
                console.error("::error::S&S catalog returned ZERO products — this is the week-long-401 failure mode. Check the key.");
                process.exit(1);
              }
              console.log(`S&S catalog alive: ${products.length} products, ${colors} colors`);
            });
          '

      - name: The artwork blob store still answers
        run: |
          # NOT a variable check. The endpoint reported configured:true for a
          # week while every direct upload failed, because it only asked
          # whether BLOB_READ_WRITE_TOKEN was set — and the store that token
          # named had been deleted. The browser reads this answer to decide
          # whether to advertise a 100 MB or a 3.5 MB ceiling, so a wrong yes
          # is the app promising a limit it cannot honour.
          # The detail block is admin-guarded now, so send the secret when
          # this workflow has one. Harmless when it does not — the check
          # below runs on `configured`, which is public, and only the
          # failure MESSAGE loses its specifics.
          json=$(curl -sS --max-time 30 \
            -H "x-admin-secret: $ADMIN_SECRET" \
            https://labs.gorillasalem.com/api/artwork-upload)
          echo "$json"
          echo "$json" | node -e '
            let raw = "";
            process.stdin.on("data", (c) => (raw += c));
            process.stdin.on("end", () => {
              const r = JSON.parse(raw);

              // REACHABLE IS NOT THE PROMISE THE BROWSER READS.
              //
              // This checked r.reachable, and between 21 and 24 Sep that
              // stayed TRUE through three separate outages in which no
              // customer could upload anything. The store was fine every
              // time; the credential the CLIENT path needed was not. A
              // green canary said so each morning.
              //
              // `configured` is the one the browser reads to choose between
              // advertising 100 MB and 3.5 MB, and it is now
              // reachable && clientUploadsReady. That is the promise worth
              // watching, so that is what this watches.
              if (r.configured !== true) {
                console.error(
                  "::error::Artwork uploads are NOT working — customers are on the 3.5 MB inline limit and larger files are collected by email. " +
                    "reachable=" + r.reachable +
                    " clientUploadsReady=" + r.detail?.clientUploadsReady +
                    " credential=" + r.detail?.credential + ". " +
                    (r.detail?.needed ?? "no detail")
                );
                process.exit(1);
              }
              console.log(
                "Artwork uploads configured via " + r.detail?.credential +
                  ", build " + r.build
              );
            });
          '

      - name: An artwork upload actually completes, end to end
        # Skipped when the secret is absent, so the canary keeps working
        # without it. Add ADMIN_SECRET to the repository's Actions secrets
        # to turn the deepest check on.
        if: ${{ env.ADMIN_SECRET != '' }}
        run: |
          # THE CHECK EVERY OTHER ONE MISSED.
          #
          # Listing a blob and uploading one are different questions, and
          # until now only the first was ever asked. This runs the four legs
          # a customer's browser runs — issue a delegation, presign a PUT,
          # push bytes through it, confirm the object landed — and deletes
          # what it wrote. See lib/blob-selftest.ts.
          json=$(curl -sS --max-time 60             -H "x-admin-secret: $ADMIN_SECRET"             https://labs.gorillasalem.com/api/blob-selftest)
          echo "$json" | node -e '
            let raw = "";
            process.stdin.on("data", (c) => (raw += c));
            process.stdin.on("end", () => {
              const r = JSON.parse(raw);
              if (r.ok !== true) {
                // Per step, so the log names WHICH leg broke. "Upload
                // failed" is the sentence that cost three days.
                const failed = (r.steps ?? []).find((s) => !s.ok);
                console.error(
                  "::error::" + (r.summary ?? "The upload self-test failed.") +
                    (failed ? ` [${failed.step}: ${failed.error}]` : "")
                );
                process.exit(1);
              }
              if (r.cleanedUp === false) {
                console.error(
                  "::warning::The self-test could not delete its test object" +
                    (r.storedPathname ? " at " + r.storedPathname : "") + "."
                );
              }
              console.log("Upload path verified end to end via " + r.credential);
            });
          '
