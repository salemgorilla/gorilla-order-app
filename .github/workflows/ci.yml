# The gate this repo has been running by hand.
#
# Every merge to date was verified because a session remembered to run the
# suite — AGENTS.md's "npm test and npx tsc --noEmit before opening the PR"
# is a working rule, not an enforced one, and nothing stops a future session
# (or a direct edit) from merging red. Vercel builds on deploy, which is
# AFTER merge, and runs no tests at all.
#
# What runs is exactly what AGENTS.md asks for, in the order a failure is
# cheapest to read: the 1,100+ node:test suite, the TypeScript check, lint
# (errors fail the job; the handful of deliberate <img> warnings do not),
# and the production build — so a Next-level breakage is caught here rather
# than on the deploy that follows the merge.
#
# What CI can NEVER replace, in this repo's own words: "any change touching
# pricing or checkout ends with one real order reconciled against the
# Printavo invoice, to the cent. Never with a passing test."

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The app lives in v2/; the repo root is the dead v1 site.
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
        with:
          # The reconciliation-debt step walks back to the commit HANDOFF.md's
          # Reconciled table last covered, which is tens of commits behind a
          # busy week. A shallow clone cannot see it; the script says so
          # rather than reporting a debt of zero, but full history is what
          # makes the step useful at all.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        # Default behaviour is the right gate: exit 1 on any error, exit 0
        # on warnings — the deliberate <img> warnings stay visible without
        # blocking, and a real error blocks.
        run: npx eslint .

      - name: Reconciliation debt
        # A WARNING, never a gate — it always exits 0, and `|| true` is a
        # second belt so a crash in it can never fail a PR.
        #
        # The remedy for a debt it reports is placing a real order and
        # reading the real Printavo invoice. No CI run can do that, and no
        # contributor can do it from a branch at 2am. A gate nobody can
        # satisfy gets bypassed, and a bypassed gate teaches the next
        # session that the Reconciled table is optional — which is how it
        # got thirty commits behind in the first place.
        #
        # So this prints the punch list into the job log, grouped by flow,
        # with the rows to paste into HANDOFF.md. Seeing it is the point.
        run: npm run reconcile:debt || true

      - name: Build
        # No secrets on purpose. The app treats every credential as optional
        # at build time (features report themselves unconfigured at runtime
        # instead), so the build must pass with none — and a change that
        # makes a credential REQUIRED to build would break Vercel previews
        # the same way. This step failing on a missing env var is a real
        # finding, not a CI problem.
        run: npm run build

      - name: Browser smoke
        # The suite above proves functions; this proves the WIRING. Every
        # sweep in this repo's history found its defects by driving the real
        # page in a real browser — review cards reading the wrong state,
        # flows renamed by a catalog default — and none of those broke a
        # unit test. tests/e2e/smoke.mjs drives all three flows to review
        # against the build that just passed, submits one apparel request,
        # and asserts the payload — with every backend stubbed at the
        # network layer, so CI never depends on S&S and never creates a
        # real quote.
        run: |
          npx playwright install --with-deps chromium
          npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100 && break; sleep 1; done
          npm run test:e2e
